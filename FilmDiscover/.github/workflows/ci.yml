name: Python CI Pipeline# 1. 觸發條件：當 main 分支有 push 或 pull request 時觸發on:  push:    branches: [ "main" ]  pull_request:    branches: [ "main" ]jobs:  build-and-test:    # 2. 執行環境：指定 GitHub 提供一台乾淨的 Ubuntu 虛擬機    runs-on: ubuntu-latest    steps:    # 步驟一：把我的 GitHub 程式碼複製（Checkout）到這台虛擬機上    - name: Checkout code      uses: actions/checkout@v4    # 步驟二：安裝並設定 Python 環境    - name: Set up Python      uses: actions/setup-python@v5      with:        python-version: '3.10' # 可以指定你的 Python 版本    # 步驟三：安裝專案所需的依賴套件（例如 pytest, requests, redis 等）    - name: Install dependencies      run: |        python -m pip install --upgrade pip        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi    # 步驟四：執行單元測試（CI 的核心！）    - name: Run Tests      run: |        pytest    # 步驟五（選用 CD）：如果測試都過了，利用 Webhook 通知 Render 進行部署    # 這裡的 RENDER_DEPLOY_HOOK 網址會安全地存放在 GitHub Secrets 中    - name: Trigger Deploy to Render      if: success() # 只有前面的步驟（測試）成功，才會執行這一步      run: |        curl -X GET "${{ secrets.RENDER_DEPLOY_HOOK }}"