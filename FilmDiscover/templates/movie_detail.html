<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>電影詳情 - FilmDiscover</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
</head>
<body class="bg-gray-900 text-white p-10">
    <div class="max-w-4xl mx-auto">
        <a href="/" class="text-blue-400 mb-5 inline-block">&larr; 回到搜尋頁</a>
        
        <div id="detailContainer" class="flex flex-col md:flex-row gap-8">
            <img id="poster" class="w-full md:w-1/3 rounded-lg shadow-xl">
            
            <div>
                <h1 id="title" class="text-4xl font-bold mb-4"></h1>
                <p id="overview" class="text-gray-300 leading-relaxed mb-6"></p>
                <div id="rating" class="text-yellow-400 font-bold mb-6"></div>
                
                <button id="aiBtn" class="bg-purple-600 hover:bg-purple-500 px-6 py-3 rounded-lg font-bold">
                    ✨ AI 深度影評分析
                </button>
            </div>
        </div>

        <div id="aiReviewArea" class="mt-10 p-6 bg-gray-800 rounded-lg hidden">
            <h2 class="text-xl font-bold text-purple-400 mb-2">AI 分析結果</h2>
            
            <div id="skeleton" class="animate-pulse space-y-3 hidden">
                <div class="h-4 bg-gray-700 rounded w-3/4"></div>
                <div class="h-4 bg-gray-700 rounded w-full"></div>
                <div class="h-4 bg-gray-700 rounded w-5/6"></div>
            </div>
        
            <div id="aiResult" class="prose prose-invert max-w-none text-gray-200"></div>
        </div>
        
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="{{ url_for('static', filename='js/movie_detail.js') }}"></script>
    
</body>
</html>
